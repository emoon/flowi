name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Full C build and the headless tests on Linux and macOS. gpu_smoke_test
  # covers each platform's GPU backend. On ubuntu-latest the mesa packages
  # provide surfaceless EGL and the llvmpipe software rasterizer, and
  # LIBGL_ALWAYS_SOFTWARE=1 forces llvmpipe, so the GL compute backend runs
  # headless. On macos-latest the Metal backend uses the runner's system
  # MTLDevice.
  c-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev clang \
            libegl1-mesa-dev libgl1-mesa-dev libegl-mesa0 libgl1-mesa-dri
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja sdl2
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: gpu_smoke_test was configured (EGL found)
        if: runner.os == 'Linux'
        run: test -x ./build/gpu_smoke_test
      - name: shared library exports exactly the curated list
        if: runner.os == 'Linux'
        run: bash tools/scripts/check_exports.sh ./build/libflowi.so src/exports/flowi.version
      - name: Default CMake shared library links SDL2
        if: runner.os == 'Linux'
        run: |
          if readelf -d ./build/libflowi.so | grep -q 'NEEDED.*libSDL2'; then
            echo "OK: default CMake libflowi.so depends on libSDL2"
          else
            echo "FAIL: default CMake libflowi.so does not depend on libSDL2"
            readelf -d ./build/libflowi.so | grep NEEDED
            exit 1
          fi
      # loc_check exits non-zero only on errors, so its warnings do not fail
      # the job.
      - name: Run loc_check over the example String Tables
        run: ./build/loc_check --manifest examples/data/localization/manifest.json --source examples
      - name: Run unit_tests
        run: ./build/unit_tests
      - name: Run gpu_smoke_test (llvmpipe)
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 ./build/gpu_smoke_test
      - name: Run gpu_smoke_test (macOS / Metal)
        if: runner.os == 'macOS'
        run: ./build/gpu_smoke_test
      # A separate configure with FLOWI_SDL_BACKEND=OFF. The headless library
      # must not depend on SDL and must export the same curated list.
      - name: Configure headless CMake opt-out
        if: runner.os == 'Linux'
        run: cmake -S . -B build-headless -G Ninja -DFLOWI_SDL_BACKEND=OFF
      - name: Build headless shared library and CPU test executable
        if: runner.os == 'Linux'
        run: cmake --build build-headless --target flowi unit_tests
      - name: Headless CMake shared library is SDL-free and exports stay curated
        if: runner.os == 'Linux'
        run: |
          if readelf -d ./build-headless/libflowi.so | grep -q 'NEEDED.*libSDL2'; then
            echo "FAIL: headless CMake libflowi.so unexpectedly depends on libSDL2"
            readelf -d ./build-headless/libflowi.so | grep NEEDED
            exit 1
          fi
          bash tools/scripts/check_exports.sh ./build-headless/libflowi.so src/exports/flowi.version
      - name: Run headless unit_tests
        if: runner.os == 'Linux'
        run: ./build-headless/unit_tests
      - name: Configure Release
        if: runner.os == 'Linux'
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release (library, test executables, examples)
        if: runner.os == 'Linux'
        run: cmake --build build-release
      - name: Run Release unit_tests
        if: runner.os == 'Linux'
        run: ./build-release/unit_tests

  # Build on macOS without an SDL host, which is what software-only embedders
  # link. FLOWI_SDL_BACKEND is OFF and only the unit_tests target is built; it
  # pulls in core, ui, render, platform, app and vfs but not gpu_smoke_test.
  # The dependencies are vendored under external/, so brew installs only the
  # build tools.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ninja
      - name: Configure (software-only)
        run: cmake -S . -B build -G Ninja -DFLOWI_SDL_BACKEND=OFF
      - name: Build unit_tests (core, ui, render, platform, app, vfs)
        run: cmake --build build --target unit_tests
      - name: gpu_smoke_test was not built (EGL absent)
        run: test ! -e ./build/gpu_smoke_test
      - name: Run unit_tests
        run: ./build/unit_tests

  # Windows shared-library build. The generated module-definition file drives
  # both flowi.dll's export table and flowi.lib, and the public-only probes in
  # unit_tests link against flowi.lib. The job is headless; GPU coverage is the
  # Linux llvmpipe run in c-build.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install static zlib
        run: vcpkg install zlib:x64-windows-static
      - name: Configure (headless shared library)
        run: >-
          cmake -S . -B build -A x64 -T ClangCL
          -DFLOWI_SDL_BACKEND=OFF -DFLOWI_GPU_BACKEND=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build shared library and CPU test executable
        run: cmake --build build --config Debug --target flowi unit_tests
      - name: flowi.dll exports exactly the generated curated list
        run: >-
          ./tools/scripts/check_windows_exports.ps1
          ./build/Debug/flowi.dll
          ./src/exports/flowi.def
      - name: Run unit_tests through flowi.lib
        run: |
          $env:PATH = "$(Resolve-Path ./build/Debug);$env:PATH"
          ./build/Debug/unit_tests.exe

  # Rust bindings: build, then the golden and panic-abort tests. The cmake crate
  # builds the C shared library. The default build is windowed, so libsdl2-dev
  # is needed to link libflowi.so, but the tests never call SDL_Init(VIDEO) and
  # need no Xvfb.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev clang \
            libegl1-mesa-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --manifest-path rust/Cargo.toml
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --no-fail-fast
      - name: Test with the global allocator installed
        run: cargo test --manifest-path rust/Cargo.toml -p flowi --features allocation-probe
      # The lint set is `[workspace.lints]` in rust/Cargo.toml, so plain
      # `cargo clippy` reports the same lints. This step turns the warnings
      # into errors.
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      # One crate build serves both a host application and a plugin, and there
      # is no `plugin` cargo feature. Fail if a `feature = "plugin"` cfg or a
      # CARGO_FEATURE_PLUGIN reference appears.
      - name: No plugin cargo feature (one crate serves host + plugins)
        run: |
          if grep -rIn --include='*.toml' --include='*.rs' -e 'feature *= *"plugin"' -e 'CARGO_FEATURE_PLUGIN' rust/; then
            echo "FAIL: a 'plugin' cargo feature reference reappeared"; exit 1
          else
            echo "OK: no plugin cargo feature"
          fi
      # The default libflowi.so is windowed: it bundles the SDL software host
      # and must carry libSDL2 as DT_NEEDED. Build it in its own target dir and
      # check the link and the export list (the version script's `local: *`
      # hides the SDL symbols). Opening a window needs a display, so this only
      # checks that it links.
      - name: Windowed default links libSDL2, exports unchanged
        run: |
          cargo build --manifest-path rust/Cargo.toml -p flowi --target-dir /tmp/flowi-windowed
          so=$(find /tmp/flowi-windowed -name 'libflowi.so' -path "*/flowi-*/out/*" | head -1)
          echo "windowed lib: $so"
          if readelf -d "$so" | grep -q 'NEEDED.*libSDL2'; then
            echo "OK: libSDL2 is DT_NEEDED"
          else
            echo "FAIL: windowed libflowi.so does not link libSDL2"; readelf -d "$so" | grep NEEDED; exit 1
          fi
          bash tools/scripts/check_exports.sh "$so" src/exports/flowi.version
      # `--no-default-features` drops the `windowed` feature. The tests must
      # pass unchanged and libflowi.so must not depend on libSDL2.
      - name: Headless (--no-default-features) is SDL-free
        run: |
          cargo test --manifest-path rust/Cargo.toml -p flowi --no-default-features --target-dir /tmp/flowi-headless
          so=$(find /tmp/flowi-headless -name 'libflowi.so' -path "*/flowi-*/out/*" | head -1)
          echo "headless lib: $so"
          if readelf -d "$so" | grep -q 'NEEDED.*libSDL2'; then
            echo "FAIL: headless libflowi.so unexpectedly links libSDL2"; readelf -d "$so" | grep NEEDED; exit 1
          else
            echo "OK: no libSDL2 dependency"
          fi
      # api_gen output is committed and must match the IDL. The check regenerates
      # into a temp dir and compares, so it leaves the tree alone and names the
      # file that differs. The generator lives in emoon/api-gen, and
      # tools/codegen/Cargo.lock pins the commit that produced the committed output.
      - name: Codegen matches the IDL
        run: cargo regen-check
