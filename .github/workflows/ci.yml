name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Full C build + the headless test suite on both Linux and macOS. unit_tests
  # (pure-CPU) runs on both. gpu_smoke_test runs on both, exercising each
  # platform's GPU backend: on ubuntu-latest the mesa packages provide EGL with
  # the surfaceless platform + the llvmpipe software rasterizer, so the GL
  # compute backend runs headlessly (LIBGL_ALWAYS_SOFTWARE=1 forces llvmpipe and
  # its golden/pixel assertions fail the job on any mismatch); on macos-latest
  # the Metal backend's Surface Binding is a system MTLDevice the runner
  # provides, so the clear-screen case + headless em_app path exercise the first
  # Metal-emitted pixel end-to-end.
  c-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev clang \
            libegl1-mesa-dev libgl1-mesa-dev libegl-mesa0 libgl1-mesa-dri
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja sdl2
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: gpu_smoke_test was configured (EGL found)
        if: runner.os == 'Linux'
        run: test -x ./build/gpu_smoke_test
      - name: shared library exports exactly the curated list
        if: runner.os == 'Linux'
        run: bash tools/scripts/check_exports.sh ./build/libflowi.so src/exports/flowi.version
      - name: Default CMake shared library links SDL2
        if: runner.os == 'Linux'
        run: |
          if readelf -d ./build/libflowi.so | grep -q 'NEEDED.*libSDL2'; then
            echo "OK: default CMake libflowi.so depends on libSDL2"
          else
            echo "FAIL: default CMake libflowi.so does not depend on libSDL2"
            readelf -d ./build/libflowi.so | grep NEEDED
            exit 1
          fi
      # Warnings are expected here and do not fail the job; only errors set a
      # non-zero exit.
      - name: Run loc_check over the example String Tables
        run: ./build/loc_check --manifest examples/data/localization/manifest.json --source examples
      - name: Run unit_tests
        run: ./build/unit_tests
      - name: Run gpu_smoke_test (llvmpipe)
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 ./build/gpu_smoke_test
      - name: Run gpu_smoke_test (macOS / Metal)
        if: runner.os == 'macOS'
        run: ./build/gpu_smoke_test
      # Exercise the C consumer's headless opt-out independently of Cargo. The
      # default build above proves the windowed artifact; this isolated configure
      # proves an explicit headless build remains SDL-free and keeps the same
      # curated public surface.
      - name: Configure headless CMake opt-out
        if: runner.os == 'Linux'
        run: cmake -S . -B build-headless -G Ninja -DFLOWI_SDL_BACKEND=OFF
      - name: Build headless shared library and CPU test executable
        if: runner.os == 'Linux'
        run: cmake --build build-headless --target flowi unit_tests
      - name: Headless CMake shared library is SDL-free and exports stay curated
        if: runner.os == 'Linux'
        run: |
          if readelf -d ./build-headless/libflowi.so | grep -q 'NEEDED.*libSDL2'; then
            echo "FAIL: headless CMake libflowi.so unexpectedly depends on libSDL2"
            readelf -d ./build-headless/libflowi.so | grep NEEDED
            exit 1
          fi
          bash tools/scripts/check_exports.sh ./build-headless/libflowi.so src/exports/flowi.version
      - name: Run headless unit_tests
        if: runner.os == 'Linux'
        run: ./build-headless/unit_tests
      - name: Configure Release
        if: runner.os == 'Linux'
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release (library, test executables, examples)
        if: runner.os == 'Linux'
        run: cmake --build build-release
      - name: Run Release unit_tests
        if: runner.os == 'Linux'
        run: ./build-release/unit_tests

  # macOS software-embed guard. flowi's software-only library set (the path
  # downstream software-only hosts like replay_backend depend on) must keep
  # building and passing on macOS so a Linux-ism can't silently rot it. The job
  # is software-only: FLOWI_SDL_BACKEND is explicitly OFF so no SDL host is
  # built, and EGL is absent on macOS so the GPU backend and gpu_smoke_test
  # self-skip in CMake. All deps (freetype2, clay, etc.) are vendored under
  # external/, so no brew packages beyond the build tools are needed.
  #
  # Building the unit_tests target pulls core, ui, render, platform, app and vfs
  # transitively and never builds gpu_smoke_test (which isn't even configured
  # without EGL); the negative assertion pins that gpu_smoke_test stayed unbuilt.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ninja
      - name: Configure (software-only)
        run: cmake -S . -B build -G Ninja -DFLOWI_SDL_BACKEND=OFF
      - name: Build unit_tests (core, ui, render, platform, app, vfs)
        run: cmake --build build --target unit_tests
      - name: gpu_smoke_test was not built (EGL absent)
        run: test ! -e ./build/gpu_smoke_test
      - name: Run unit_tests
        run: ./build/unit_tests

  # Windows shared-library ABI guard. The generated module-definition
  # file must drive both flowi.dll's export table and flowi.lib, which the
  # public-only probes exercised by unit_tests consume. This job stays headless;
  # GPU coverage remains the Linux llvmpipe job above.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install static zlib
        run: vcpkg install zlib:x64-windows-static
      - name: Configure (headless shared library)
        run: >-
          cmake -S . -B build -A x64 -T ClangCL
          -DFLOWI_SDL_BACKEND=OFF -DFLOWI_GPU_BACKEND=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build shared library and CPU test executable
        run: cmake --build build --config Debug --target flowi unit_tests
      - name: flowi.dll exports exactly the generated curated list
        run: >-
          ./tools/scripts/check_windows_exports.ps1
          ./build/Debug/flowi.dll
          ./src/exports/flowi.def
      - name: Run unit_tests through flowi.lib
        run: |
          $env:PATH = "$(Resolve-Path ./build/Debug);$env:PATH"
          ./build/Debug/unit_tests.exe

  # Rust bindings: build + the golden and panic-abort tests. The cmake crate builds
  # the C shared library. The default is windowed (libflowi.so links
  # libSDL2), but the tests still run headless (they never SDL_Init(VIDEO)), so no
  # Xvfb is needed; libsdl2-dev is required so the default .so links libSDL2.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev clang \
            libegl1-mesa-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --manifest-path rust/Cargo.toml
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --no-fail-fast
      - name: Test with the global allocator installed
        run: cargo test --manifest-path rust/Cargo.toml -p flowi --features allocation-probe
      # The lint set is `[workspace.lints]` in rust/Cargo.toml, so a developer
      # running plain `cargo clippy` sees exactly what this enforces; all this
      # adds is turning the warnings into a failure.
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      # one crate build serves both a host application and a plugin — there
      # is no plugin-dispatch cargo feature. Guard the structural claim so a
      # re-introduced `plugin` feature (a `feature = "plugin"` cfg, or the old
      # CARGO_FEATURE_PLUGIN build.rs gate) fails CI instead of relying on review.
      - name: No plugin cargo feature (one crate serves host + plugins)
        run: |
          if grep -rIn --include='*.toml' --include='*.rs' -e 'feature *= *"plugin"' -e 'CARGO_FEATURE_PLUGIN' rust/; then
            echo "FAIL: a 'plugin' cargo feature reference reappeared"; exit 1
          else
            echo "OK: no plugin cargo feature"
          fi
      # the default shipped libflowi.so is windowed — it bundles the SDL
      # software host and must carry libSDL2 as DT_NEEDED. Build the default (windowed)
      # flowi in an isolated target dir and assert both the link and that the curated
      # export surface is unchanged (SDL symbols stay hidden by the version script's
      # `local: *`). Opening a real window needs a display, so CI proves it *links*.
      - name: Windowed default links libSDL2, exports unchanged
        run: |
          cargo build --manifest-path rust/Cargo.toml -p flowi --target-dir /tmp/flowi-windowed
          so=$(find /tmp/flowi-windowed -name 'libflowi.so' -path "*/flowi-*/out/*" | head -1)
          echo "windowed lib: $so"
          if readelf -d "$so" | grep -q 'NEEDED.*libSDL2'; then
            echo "OK: libSDL2 is DT_NEEDED"
          else
            echo "FAIL: windowed libflowi.so does not link libSDL2"; readelf -d "$so" | grep NEEDED; exit 1
          fi
          bash tools/scripts/check_exports.sh "$so" src/exports/flowi.version
      # headless opt-out: `--no-default-features` drops the `windowed` feature
      # and restores the SDL-free libflowi.so. Prove it builds+tests with no
      # consumer source changes AND that the .so carries no libSDL2 dependency.
      - name: Headless (--no-default-features) is SDL-free
        run: |
          cargo test --manifest-path rust/Cargo.toml -p flowi --no-default-features --target-dir /tmp/flowi-headless
          so=$(find /tmp/flowi-headless -name 'libflowi.so' -path "*/flowi-*/out/*" | head -1)
          echo "headless lib: $so"
          if readelf -d "$so" | grep -q 'NEEDED.*libSDL2'; then
            echo "FAIL: headless libflowi.so unexpectedly links libSDL2"; readelf -d "$so" | grep NEEDED; exit 1
          else
            echo "OK: no libSDL2 dependency"
          fi
      # api_gen output is committed and must match the IDL. The check regenerates into
      # a temp dir and compares, so it never mutates the tree and it names the file that
      # drifted - catching a hand-edited mirror or a stale checkout. The generator itself
      # lives in emoon/api-gen and is tested there; tools/codegen/Cargo.lock pins the exact
      # commit that produced the committed output.
      - name: Codegen matches the IDL
        run: cargo regen-check
