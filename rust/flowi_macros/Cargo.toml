[package]
name = "flowi_macros"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Procedural macros for the flowi Rust bindings"
publish = false

[lib]
proc-macro = true
doctest = false

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# Inherit the workspace lint policy (see rust/Cargo.toml).
[lints]
workspace = true
